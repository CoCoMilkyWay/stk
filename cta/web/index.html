<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>CTA 轨迹</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      body {
        margin: 0;
        font:
          13px system-ui,
          sans-serif;
        display: flex;
        height: 100vh;
      }
      #side {
        width: 290px;
        padding: 10px;
        overflow-y: auto;
        border-right: 1px solid #ddd;
        box-sizing: border-box;
        flex: none;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }
      #cursor {
        position: absolute;
        display: none;
        border-left: 1px dashed #888;
        pointer-events: none;
      }
      #chart {
        flex: 1;
        min-height: 0;
      }
      fieldset {
        border: 1px solid #ddd;
        margin: 0 0 8px;
        padding: 6px 8px;
      }
      legend {
        color: #555;
      }
      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 3px 0;
        gap: 6px;
      }
      label input,
      label select {
        width: 130px;
      }
      label input:disabled {
        color: #777;
        background: #f0f0f0;
        border: 1px solid #ddd;
      }
      #asset {
        width: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      td,
      th {
        padding: 1px 4px;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
        color: #555;
      }
      #busy {
        color: #b00;
        font-weight: normal;
      }
      .hint {
        color: #888;
        font-size: 11px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="side">
      <fieldset>
        <legend>资产</legend>
        <label
          >测试集
          <select id="set">
            <option value="idx">指数</option>
            <option value="ind">行业</option>
            <option value="concept">概念</option>
          </select></label
        >
        <label
          >筛选 <input id="filter" type="search" placeholder="名 / 码"
        /></label>
        <select id="asset" size="8"></select>
      </fieldset>
      <fieldset>
        <legend>优化目标</legend>
        <label
          >目标
          <select id="target">
            <option value="sharpe">夏普</option>
            <option value="sortino">索提诺</option>
            <option value="band">带质量</option>
          </select></label
        >
        <label
          >滚动窗 (日, ≥ 250)
          <input id="roll" type="number" step="1" min="250" value="250"
        /></label>
        <div class="hint">
          每日重拟; 带质量 = (带外顺向 − 带内来回 − 费率 × 换手) / 总振幅
        </div>
      </fieldset>
      <div id="parts"></div>
      <div class="hint" id="at"></div>
      <div class="hint">
        各组只选模型; 参数由优化目标滚动选出 (本资产前 W 日的网格曲面,
        岭回归后取最高点), 灰显的是图上光标处所用的; 周期轴以日计; k = 半宽倍数,
        N = 层数, h = 层内滞回 (占通道全宽)
      </div>
      <fieldset>
        <legend>引擎</legend>
        <label
          >单边费率 (bp)
          <input id="cost" type="number" step="1" min="0" value="10"
        /></label>
        <label
          >目标年化波动 (0 = 不调)
          <input id="vol" type="number" step="0.05" min="0" value="0"
        /></label>
        <label
          >不交易带
          <input id="buffer" type="number" step="0.05" min="0" value="0"
        /></label>
      </fieldset>
      <fieldset>
        <legend>全期指标 <span id="busy"></span></legend>
        <div class="hint" id="span"></div>
        <table id="stats"></table>
        <div class="hint">
          图上框选放大 (后端按视窗重新聚合, 逐根时标加减仓), 双击回全期;
          鼠标所在处即光标
        </div>
      </fieldset>
    </div>
    <div id="main">
      <div id="chart"></div>
      <div id="cursor"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
